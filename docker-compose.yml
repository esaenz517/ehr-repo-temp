version: "3.9"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: app-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-net

  # One-shot job that waits for SQL Server to be healthy, then runs init.sql
  # to create the database/table/seed data (SQL Server doesn't auto-run
  # initdb.d scripts the way Postgres/MySQL images do).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: app-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/init:/init
    entrypoint: >
      bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P 'YourStrong!Passw0rd' -C -b -i /init/init.sql
      "
    networks:
      - app-net

  backend:
    build:
      context: ./backend
    container_name: app-backend
    environment:
      DB_SERVER: "db"
      DB_PORT: "1433"
      DB_NAME: "AppDb"
      DB_USER: "dev"
      DB_PASSWORD: "dev123"
      CORS_ORIGINS: "http://localhost:3000"
      # DUO_ENABLED=true to reactivate duo auth
      DUO_ENABLED: "${DUO_ENABLED:-false}"
      DUO_CLIENT_ID: "${DUO_CLIENT_ID:-}"
      DUO_CLIENT_SECRET: "${DUO_CLIENT_SECRET:-}"
      DUO_API_HOST: "${DUO_API_HOST:-}"
      DUO_REDIRECT_URI: "http://localhost:8000/auth/duo/callback"
      FRONTEND_URL: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - app-net
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8000"
    container_name: app-frontend
    environment:
      VITE_API_URL: "http://localhost:8000"
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-net

  # Web-based GUI for browsing the SQL Server database at http://localhost:8081.
  # On first visit it walks you through creating an admin account, then add a
  # connection to server "db", port 1433, user "dev" (see README for password).
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: app-cloudbeaver
    ports:
      - "8081:8978"
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  # One-shot job that just prints out where everything is running once the
  # other services have started. Purely informational - safe to ignore its
  # exit.
  urls:
    image: alpine:3.20
    container_name: app-urls
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      cloudbeaver:
        condition: service_started
    entrypoint: >
      sh -c "
      echo '';
      echo '--- App is up ---';
      echo 'Frontend:    http://localhost:3000';
      echo 'Backend:     http://localhost:8000';
      echo 'API docs:    http://localhost:8000/docs';
      echo 'CloudBeaver: http://localhost:8081';
      echo '';
      "
    networks:
      - app-net

  # --- TESTS (profile "test": only started by the commands below) ---
  # Backend API tests against a throwaway database built from the init scripts.
  #   SQL Server: docker compose --profile test run --rm backend-tests
  #   Postgres:   docker compose --profile test run --rm backend-tests-pg
  # Extra pytest arguments go at the end, e.g. ... backend-tests -k assignments
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
    environment:
      DB_DIALECT: "mssql"
      DB_SERVER: "db"
      DB_PORT: "1433"
      DB_NAME: "AppDbTest"   # dropped and rebuilt on every run; never AppDb
      DB_USER: "sa"          # needs to create and drop the test database
      DB_PASSWORD: "YourStrong!Passw0rd"
      DB_SCRIPTS_DIR: "/db"
    volumes:
      - ./backend:/app
      - ./db:/db:ro
    entrypoint: ["sh", "-c", "pip install -q --root-user-action=ignore -r requirements-dev.txt && pytest \"$$@\"", "--"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  # Postgres for the Postgres test run (same major version family as Supabase).
  test-postgres:
    profiles: ["test"]
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "test"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - app-net

  backend-tests-pg:
    profiles: ["test"]
    build:
      context: ./backend
    environment:
      DB_DIALECT: "postgres"
      DB_SERVER: "test-postgres"
      DB_PORT: "5432"
      DB_NAME: "ehr_test"
      DB_USER: "postgres"
      DB_PASSWORD: "test"
      DB_SSLMODE: "disable"
      DB_SCRIPTS_DIR: "/db"
    volumes:
      - ./backend:/app
      - ./db:/db:ro
    entrypoint: ["sh", "-c", "pip install -q --root-user-action=ignore -r requirements-dev.txt && pytest \"$$@\"", "--"]
    depends_on:
      test-postgres:
        condition: service_healthy
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  mssql-data:
  cloudbeaver-data:
