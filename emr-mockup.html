<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTEP Educational EMR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<!--
  Frontend mockup: Educational EMR note-creation workflow (Sprint 2 demo).
  Frontend only. All state lives in memory and is seeded from the mock data below.
  React 18.3.1 and htm 3.1.1 are embedded at the end of this file so the page works offline.
-->
<style>
:root{
  --bg:#EDF2F3; --surface:#FFFFFF; --surface-2:#F5F8F9; --sunken:#E4EBED;
  --ink:#13222A; --ink-2:#34464E; --muted:#56686F; --line:#D2DCE0; --line-2:#AFBFC6;
  --accent:#0A5A6F; --accent-hover:#07475A; --accent-ink:#FFFFFF; --accent-soft:#E0EEF1; --accent-line:#95C2CE;
  --crit:#B3261E; --crit-soft:#FCEBEA; --crit-line:#EBAEA9;
  --warn:#824600; --warn-soft:#FFF1D6; --warn-line:#E9C47A;
  --ret-bg:#A85A06; --ret-ink:#FFFFFF;
  --ok:#1A6841; --ok-soft:#E1F1E7; --ok-line:#A0D1B3;
  --focus:#1B66D6;
  --backdrop:rgba(12,28,36,.55);
  --shadow:0 1px 2px rgba(14,40,50,.07),0 2px 8px rgba(14,40,50,.05);
  --shadow-lg:0 18px 50px rgba(8,26,34,.28);
  --tb-h:64px; --bn-h:140px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161A; --surface:#162127; --surface-2:#1B2830; --sunken:#111B20;
    --ink:#E3ECEF; --ink-2:#C0CED4; --muted:#93A6AE; --line:#2A3A42; --line-2:#40545D;
    --accent:#5CB8CF; --accent-hover:#7DCADC; --accent-ink:#04212A; --accent-soft:#15343D; --accent-line:#2F6878;
    --crit:#FF8F86; --crit-soft:#3A1614; --crit-line:#74302A;
    --warn:#F4C46E; --warn-soft:#32250E; --warn-line:#6E5320;
    --ret-bg:#F0A650; --ret-ink:#2A1600;
    --ok:#83D5A8; --ok-soft:#122E20; --ok-line:#2D5B41;
    --focus:#7FB6FF; --backdrop:rgba(0,0,0,.65);
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 18px 50px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161A; --surface:#162127; --surface-2:#1B2830; --sunken:#111B20;
  --ink:#E3ECEF; --ink-2:#C0CED4; --muted:#93A6AE; --line:#2A3A42; --line-2:#40545D;
  --accent:#5CB8CF; --accent-hover:#7DCADC; --accent-ink:#04212A; --accent-soft:#15343D; --accent-line:#2F6878;
  --crit:#FF8F86; --crit-soft:#3A1614; --crit-line:#74302A;
  --warn:#F4C46E; --warn-soft:#32250E; --warn-line:#6E5320;
  --ret-bg:#F0A650; --ret-ink:#2A1600;
  --ok:#83D5A8; --ok-soft:#122E20; --ok-line:#2D5B41;
  --focus:#7FB6FF; --backdrop:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:.9375rem;line-height:1.5}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.5rem;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.125rem;font-weight:600}
h3{font-size:.9375rem;font-weight:600}
p{margin:0}
ul,ol{margin:0;padding:0}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.8125rem}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus:not(:focus-visible){outline:none}
.ic{flex:none;display:inline-block;vertical-align:-.18em}
.skip{position:absolute;left:12px;top:-80px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:.5rem .9rem;border-radius:6px}
.skip:focus{top:12px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:inherit;font-size:.875rem;font-weight:500;line-height:1.2;padding:.5rem .9rem;min-height:2.3rem;border-radius:6px;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--accent);border-color:var(--accent-line)}
.btn-secondary:hover{background:var(--accent-soft)}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--crit);color:#fff}
:root[data-theme="dark"] .btn-danger{color:#2A0806}
.btn-link{background:none;border:0;color:var(--accent);padding:.2rem .15rem;min-height:0;text-decoration:underline;text-underline-offset:2px}
.btn-sm{font-size:.8125rem;padding:.3rem .6rem;min-height:1.95rem}
.btn-icon{padding:.3rem;min-height:1.95rem;min-width:1.95rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}

/* ---------- badges & chips ---------- */
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:600;line-height:1.3;padding:.2rem .6rem;border-radius:999px;border:1px solid;white-space:nowrap}
.badge-lg{font-size:.875rem;padding:.32rem .8rem}
.b-neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--line-2)}
.b-accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.b-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.b-returned{background:var(--ret-bg);color:var(--ret-ink);border-color:var(--ret-bg)}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.b-crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-line)}
.chip-allergy{display:inline-flex;align-items:center;gap:.4rem;background:var(--crit);color:#fff;font-weight:700;font-size:.8125rem;letter-spacing:.02em;padding:.3rem .7rem;border-radius:6px}
:root[data-theme="dark"] .chip-allergy{color:#2A0806}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip-allergy,:root:not([data-theme="light"]) .btn-danger{color:#2A0806}}
.chip-nkda{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line-2);color:var(--ink-2);font-weight:600;font-size:.8125rem;padding:.25rem .65rem;border-radius:6px}
.tag{display:inline-flex;align-items:baseline;gap:.35rem;font-size:.78rem;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:.1rem .45rem;background:var(--surface-2)}
.tag-k{text-transform:uppercase;letter-spacing:.06em;font-size:.68rem;color:var(--muted);font-weight:600}
.act{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.1rem .45rem;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface-2)}
.act-start{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.act-adjust{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.act-discontinue{text-decoration:line-through}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(.55rem + env(safe-area-inset-top,0px)) 20px .55rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem 1.25rem}
.tb-left,.tb-right{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem}
.wordmark{font-size:1.02rem;font-weight:500;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.wordmark b{font-weight:700;color:var(--accent)}
.wordmark .wm-mark{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;background:var(--accent);margin-right:.45rem;vertical-align:.02em}
.train-badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:600;color:var(--warn);background:var(--warn-soft);border:1px dashed var(--warn-line);border-radius:4px;padding:.18rem .5rem;white-space:nowrap}
.seg{display:flex;align-items:center;gap:.5rem}
.seg-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.seg-opts{position:relative;display:inline-flex;border:1px solid var(--line-2);border-radius:7px;padding:2px;background:var(--surface-2)}
.seg-opts input{position:absolute;opacity:0;width:1px;height:1px}
.seg-opts label{display:inline-flex;align-items:center;gap:.35rem;font-size:.8125rem;font-weight:500;padding:.3rem .7rem;border-radius:5px;cursor:pointer;color:var(--ink-2)}
.seg-opts input:checked+label{background:var(--accent);color:var(--accent-ink)}
.seg-opts input:focus-visible+label{outline:3px solid var(--focus);outline-offset:1px}
.tb-user{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:500;color:var(--ink-2)}
.textsize{display:inline-flex;align-items:center;gap:.25rem}
.ts-val{font-size:.75rem;color:var(--muted);min-width:2.6rem;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- page ---------- */
main{max-width:1360px;margin:0 auto;padding-inline:20px;padding-block:1.25rem 3rem}
main:focus{outline:none}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.1rem}
.page-head p{color:var(--muted);margin-top:.25rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.panel-pad{padding:1rem 1.1rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem}
.row-between{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem .75rem}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.field>label,.field-head label,.flabel{font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.field-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.req{color:var(--crit);margin-left:.15rem}
.hint{font-size:.78rem;color:var(--muted)}
.err{display:flex;align-items:center;gap:.35rem;font-size:.8125rem;color:var(--crit);font-weight:500}
input[type=text],input[type=password],input[type=date],input[type=search],input:not([type]),select,textarea{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:.45rem .6rem;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
input[readonly],textarea[readonly]{background:var(--surface-2);color:var(--ink-2)}
[aria-invalid="true"]{border-color:var(--crit)!important;box-shadow:0 0 0 1px var(--crit)}
input[type=checkbox],input[type=radio]{width:1.05rem;height:1.05rem;accent-color:var(--accent);margin:0;flex:none}
.check{display:flex;align-items:flex-start;gap:.55rem}
.check label{font-size:.9rem}
.check input{margin-top:.2rem}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-weight:600}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem 1rem}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem 1rem}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem 1rem}
.span-2{grid-column:span 2}
.span-all{grid-column:1/-1}

/* mic */
.mic{display:inline-flex;align-items:center;gap:.3rem;font:inherit;font-size:.75rem;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.15rem .55rem;cursor:pointer;min-height:1.7rem}
.mic:hover{border-color:var(--accent-line);color:var(--accent)}
.mic.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.mic-dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.875rem}
caption{text-align:left;padding:.75rem 1rem;font-weight:600;border-bottom:1px solid var(--line);background:var(--surface-2)}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:.6rem .8rem;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:.65rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.row-flag td{background:var(--warn-soft)}
.cell-sub{display:block;font-size:.78rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- login ---------- */
.login{display:grid;place-items:start center;padding-top:2rem}
.login-card{width:100%;max-width:440px;padding:1.6rem}
.login-card h1{margin-bottom:.3rem}
.code-sent{display:flex;gap:.5rem;align-items:flex-start;font-size:.85rem;color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok-line);border-radius:6px;padding:.5rem .65rem}
.code-input{font-family:var(--mono)!important;letter-spacing:.35em;font-size:1.1rem!important}

/* ---------- callouts ---------- */
.callout{display:flex;flex-direction:column;gap:.6rem;border:1px solid;border-radius:8px;padding:.9rem 1rem}
.callout-head{display:flex;align-items:flex-start;gap:.75rem}
.callout-head>div{flex:1;min-width:0}
.callout-head p{font-size:.875rem;margin-top:.2rem}
.callout-info{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.callout-info>.callout-head>.ic{color:var(--accent)}
.callout-warn{background:var(--warn-soft);border-color:var(--warn-line)}
.callout-warn>.callout-head>.ic{color:var(--warn)}
.callout-returned{background:var(--warn-soft);border:2px solid var(--ret-bg)}
.callout-returned>.callout-head>.ic{color:var(--ret-bg)}
.callout-final{background:var(--ok-soft);border-color:var(--ok-line)}
.callout-final>.callout-head>.ic{color:var(--ok)}
.callout-crit{background:var(--crit-soft);border-color:var(--crit-line)}
.callout-crit>.callout-head>.ic{color:var(--crit)}
.comment-list{list-style:none;display:flex;flex-direction:column;gap:.35rem;padding-left:2.1rem}
.comment-list li{font-size:.9rem}
.comment-list a{font-weight:600}

/* ---------- dashboard ---------- */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.75rem;margin-bottom:1.1rem}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.85rem .95rem;cursor:pointer;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent-line)}
.tile-top{display:flex;align-items:center;gap:.4rem;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.tile-n{font-size:1.9rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile.hl{background:var(--warn-soft);border:2px solid var(--warn-line)}
.tile.hl .tile-top{color:var(--warn)}
.tile[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.tile-sub{font-size:.72rem;color:var(--muted)}

/* ---------- chart ---------- */
.crumbs{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem;font-size:.875rem}
.banner{position:sticky;top:var(--tb-h);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:.8rem 1rem;display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem}
.bn-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem 1.25rem}
.bn-id{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem 1.2rem}
.bn-id h1{font-size:1.35rem}
.bn-id .pref{font-weight:400;color:var(--muted);font-size:1rem}
.bn-facts{display:flex;flex-wrap:wrap;gap:.2rem 1.1rem;margin:0}
.bn-facts div{display:flex;gap:.35rem;align-items:baseline}
.bn-facts dt{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.bn-facts dd{margin:0;font-size:.9rem;font-weight:500}
.bn-flags{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem}
.bn-row2{border-top:1px solid var(--line);padding-top:.6rem}
.bn-meta{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:.35rem}
.stepper-wrap{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;min-width:0}
.stepper-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stepper{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:.25rem}
.stepper li{display:inline-flex;align-items:center;gap:.25rem;font-size:.78rem;color:var(--muted)}
.stepper li+li::before{content:"";width:.9rem;height:1px;background:var(--line-2)}
.st-item{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .5rem .12rem .2rem;border-radius:999px}
.st-dot{display:inline-grid;place-items:center;width:1.15rem;height:1.15rem;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface)}
.stepper li.done{color:var(--ink-2)}
.stepper li.done .st-dot{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.stepper li.current .st-item{color:var(--accent-ink);background:var(--accent);font-weight:600}
.stepper li.current .st-dot{border-color:var(--accent-ink);background:transparent;color:var(--accent-ink)}
.chart-body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:1.1rem;align-items:start}
.chart-body>nav{position:sticky;top:calc(var(--tb-h) + var(--bn-h) + 1.2rem);align-self:start}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:.5rem;font:inherit;font-size:.875rem;text-align:left;color:var(--ink-2);background:transparent;border:0;border-left:3px solid transparent;border-radius:0 6px 6px 0;padding:.5rem .7rem;cursor:pointer}
.tab:hover{background:var(--surface)}
.tab[aria-selected="true"]{background:var(--surface);border-left-color:var(--accent);color:var(--accent);font-weight:600;box-shadow:var(--shadow)}
.tab .tab-flag{margin-left:auto}
.tabpanel{min-width:0}
.panel-title{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.8rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.6rem}
.card h3{display:flex;align-items:center;gap:.45rem;font-size:.8125rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card.card-note{border-color:var(--accent-line)}
.kv{list-style:none;display:flex;flex-direction:column;gap:.4rem}
.kv li{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;font-size:.875rem}
.kv li>span:first-child{min-width:0}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem .9rem;margin:0}
.vgrid div{display:flex;flex-direction:column}
.vgrid dt{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.vgrid dd{margin:0;font-family:var(--mono);font-size:.95rem;font-variant-numeric:tabular-nums}

/* ---------- SOAP editor ---------- */
.editor{display:flex;flex-direction:column;gap:1rem}
.ed-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.75rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.8rem 1rem}
.ed-head .field{flex:1 1 280px;max-width:420px}
.save-ind{display:inline-flex;align-items:center;gap:.35rem;font-size:.8125rem;color:var(--muted);margin-left:auto;padding-bottom:.45rem}

function newNoteData(p) {

    vitals: { ...p.vitals },

    problems: [], meds: [], education: '', followup: '', followupCustom: '', referrals: [],

}
function newNote(p) {
  return {
    status: 'Not started', template: 'General SOAP', data: newNoteData(p), version: 1, revising: false,
    lastSaved: null, dirty: false, routeTo: null, events: [], comments: [], round: 0, addenda: [],
    cosign: null, showErrors: false,
  };
}
function makeAssignment(c, studentId, assignedAt, patientOverride) {
  // Grading mode: each student gets an isolated deep copy of the patient.
  // Practice mode: students share the case's patient record.
  const p = c.mode === 'Grading' ? clone(patientOverride || c.patient) : null;
  const a = {
    id: uid('a'), caseId: c.id, studentId, patient: p, mode: c.mode, course: c.course,
    assignedBy: c.assignedBy, due: c.due, encounter: 'Checked in',
    note: newNote(p || c.patient), audit: [], assignedAt: assignedAt || now(),
  };
  a.audit.push({ t: a.assignedAt, who: c.assignedBy, action: 'Assigned',
    detail: c.mode === 'Grading' ? `Isolated copy created for ${personName(studentId)}` : `Shared practice patient assigned to ${personName(studentId)}` });
  return a;
}

/* =====================================================================
   Actions
   ===================================================================== */
function toast(text, kind) {
  const t = { id: uid('t'), text, kind: kind || 'ok' };
  S.toasts = [...S.toasts.slice(-2), t]; commit();
  setTimeout(() => { S.toasts = S.toasts.filter(x => x !== t); commit(); }, 4000);
}
function go(patch) { Object.assign(S.nav[S.role], patch); S.pendingFocus = true; commit(); }
function openChart(a) {
  audit(a, 'Viewed', S.role === 'student' ? 'Opened patient chart' : 'Opened note for review');
  go({ screen: 'chart', aId: a.id, tab: S.role === 'student' ? (a.note.status === 'Not started' ? 'summary' : 'note') : 'note' });
}
function setTab(t) { S.nav[S.role].tab = t; commit(); }

const saveTimers = {};
function touch(a) {
  a.note.dirty = true; commit();
  clearTimeout(saveTimers[a.id]);
  saveTimers[a.id] = setTimeout(() => autosave(a), 1200);
}
function autosave(a) {
  const n = a.note;
  clearTimeout(saveTimers[a.id]);
  if (!n.dirty) return;
  n.dirty = false; n.lastSaved = now();
  if (n.status === 'Not started') {
    n.status = 'Draft'; audit(a, 'Created', 'Created note draft');
    n.events.push(mkEvent(n.version, 'Draft saved', a.studentId, n.lastSaved, n.data, 'First save (autosave)'));
  }
  commit();
}
function saveDraft(a) {
  const n = a.note;
  n.dirty = true; autosave(a);
  n.events.push(mkEvent(n.version, 'Draft saved', currentUserId(), now(), n.data));
  audit(a, 'Edited', `Saved draft v${n.version}`);
  toast(`Draft saved at ${fmtTime(n.lastSaved)}.`);
}
function startEncounter(a) {
  if (a.encounter === 'Scheduled') {
    a.encounter = 'Checked in'; audit(a, 'Encounter', 'Encounter status: Checked in');
    toast('Patient checked in.'); return;
  }
  a.encounter = 'In progress';
  audit(a, 'Encounter', 'Encounter status: In progress');
  S.nav.student.tab = 'note';
  toast('Encounter started. Status: In progress.');
  focusId('tab-note');
}
function validate(d) {
  const e = {};
  if (!d.problems.length) e.problems = 'Add at least one ICD-10 problem in the Assessment.';
  d.problems.forEach(pr => { if (!pr.rationale.trim()) e['rat-' + pr.code] = `Enter a clinical rationale for ${pr.code}.`; });
  if (!d.meds.length && !d.referrals.length) e.plan = 'Add at least one plan item (a medication or a referral).';
  return e;
}
const errTarget = k => (k === 'problems' ? 'icd-search' : k === 'plan' ? 'drug-select' : k);
function submitNote(a, instrId) {
  const n = a.note;
  const resubmit = n.round > 0;
  n.dirty = false; clearTimeout(saveTimers[a.id]);
  n.status = 'Pending review'; n.revising = false; n.routeTo = instrId; n.showErrors = false; n.lastSaved = now();
  n.events.push(mkEvent(n.version, resubmit ? 'Resubmitted' : 'Submitted', currentUserId(), now(), n.data, `Routed to ${personName(instrId)}`));
  if (ENC.indexOf(a.encounter) < ENC.indexOf('Completed')) a.encounter = 'Completed';
  audit(a, 'Signed', `Student signed v${n.version} and routed to ${person(instrId).short}`);
  S.modal = null;
  toast(`Note signed and sent to ${personName(instrId)} for co-signature. Status: Pending review.`);
  S.pendingFocus = true;
}
function reviseNote(a) {
  const n = a.note;
  n.revising = true; n.version += 1;
  n.events.push(mkEvent(n.version, 'Draft saved', currentUserId(), now(), n.data, `Revision opened from v${n.version - 1}`));
  audit(a, 'Edited', `Opened revision v${n.version}`);
  toast(`Editing unlocked. You are now working on v${n.version}.`);
  focusId('h-S');
}
function returnNote(a) {
  const n = a.note;
  const cs = n.comments.filter(c => c.round === n.round + 1);
  n.round += 1; n.status = 'Returned';
  n.events.push(mkEvent(n.version, 'Returned', currentUserId(), now(), n.data, plural(cs.length, 'comment')));
  audit(a, 'Returned', `Returned v${n.version} for revision with ${plural(cs.length, 'comment')}`);
  toast(`Returned to ${personName(a.studentId)} for revision.`);
}
function cosignNote(a) {
  const n = a.note;
  n.status = 'Final'; n.cosign = { by: currentUserId(), t: now() };
  a.encounter = 'Signed/Closed';
  n.events.push(mkEvent(n.version, 'Co-signed', currentUserId(), now(), n.data, 'Note locked. Encounter: Signed/Closed'));
  audit(a, 'Co-signed', `Approved and co-signed v${n.version}; note locked`);
  S.modal = null;
  toast('Note co-signed and locked. Encounter status: Signed/Closed.');
}
function addAddendum(a, text) {
  const n = a.note;
  const ad = { id: uid('ad'), by: currentUserId(), role: S.role, t: now(), text };
  n.addenda.push(ad);
  n.events.push(mkEvent(n.version, 'Addendum', currentUserId(), ad.t, n.data, `Addendum ${n.addenda.length}: ${text.length > 90 ? text.slice(0, 90) + '…' : text}`));
  audit(a, 'Addendum', `Added addendum ${n.addenda.length} to final note`);
  toast('Addendum added. The original note is unchanged.');
}
const lastEvent = (n, actions) => [...n.events].reverse().find(e => actions.includes(e.action));

function Icon({ name, size, label }) {
  return html`<svg className="ic" width=${size || 16} height=${size || 16} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" role=${label ? 'img' : undefined}
    aria-label=${label || undefined} aria-hidden=${label ? undefined : 'true'} focusable="false"
    dangerouslySetInnerHTML=${{ __html: ICONS[name] || '' }}></svg>`;
}

const NOTE_STATUS = {
  'Not started': { icon: 'dash', cls: 'b-neutral', label: 'Not started' },
  'Draft': { icon: 'pencil', cls: 'b-accent', label: 'Draft' },
  'Pending review': { icon: 'clock', cls: 'b-warn', label: 'Pending review' },
  'Returned': { icon: 'undo', cls: 'b-returned', label: 'Returned' },
  'Final': { icon: 'lock', cls: 'b-ok', label: 'Final (co-signed)' },
};
function NoteBadge({ status, studentView, big }) {
  const c = NOTE_STATUS[status];
  const label = studentView && status === 'Returned' ? 'Returned — revisions requested' : c.label;
  return html`<span className=${`badge ${c.cls}${big || (studentView && status === 'Returned') ? ' badge-lg' : ''}`}>
    <${Icon} name=${c.icon} size=${14}/><span><span className="sr-only">Note status: </span>${label}</span></span>`;
}
function ModeBadge({ mode }) {
  return mode === 'Grading'
    ? html`<span className="badge b-accent"><${Icon} name="clipboard" size=${14}/><span><span className="sr-only">Mode: </span>Grading</span></span>`
    : html`<span className="badge b-neutral"><${Icon} name="flask" size=${14}/><span><span className="sr-only">Mode: </span>Practice</span></span>`;
}
function FlagBadge({ flag }) {
  if (flag === 'High') return html`<span className="badge b-crit"><${Icon} name="arrowUp" size=${13}/>High</span>`;
  if (flag === 'Low') return html`<span className="badge b-crit"><${Icon} name="arrowDown" size=${13}/>Low</span>`;
  return html`<span className="badge b-neutral"><${Icon} name="check" size=${13}/>Normal</span>`;
}
function AllergyChips({ p }) {
  if (!p.allergies.length) return html`<span className="chip-nkda"><${Icon} name="check" size=${14}/>NKDA — no known drug allergies</span>`;
  return p.allergies.map((al, i) => html`<span key=${i} className="chip-allergy"><${Icon} name="alert" size=${15}/>
    <span><span className="sr-only">Allergy: </span>${al.agent.toUpperCase()} — ${al.reaction}</span></span>`);
}

function Mic({ label }) {
  const [on, setOn] = useState(false);
  useEffect(() => { if (!on) return; const t = setTimeout(() => setOn(false), 6000); return () => clearTimeout(t); }, [on]);
  return html`<span>
    <button type="button" className=${'mic' + (on ? ' on' : '')} aria-pressed=${on} onClick=${() => setOn(!on)}
      title="Dictation placeholder: no audio is recorded">
      ${on ? html`<span className="mic-dot" aria-hidden="true"></span>` : html`<${Icon} name="mic" size=${14}/>`}
      <span>${on ? 'Listening…' : 'Dictate'}</span><span className="sr-only"> into ${label}</span>
    </button>
    <span className="sr-only" role="status">${on ? `Listening for ${label}. Dictation is a placeholder in this mockup.` : ''}</span>
  </span>`;
}

function describedBy(id, hint, error) { return [hint && id + '-hint', error && id + '-err'].filter(Boolean).join(' ') || undefined; }
function FieldError({ id, error }) {
  return error ? html`<p className="err" id=${id + '-err'}><${Icon} name="alert" size=${14}/>${error}</p>` : null;
}
function TextArea({ id, label, value, onChange, rows, hint, error, required, noMic, className, inputRef }) {
  return html`<div className=${'field ' + (className || '')}>
    <div className="field-head"><label htmlFor=${id}>${label}${required && html`<span className="req" aria-hidden="true">*</span>`}</label>
      ${!noMic && html`<${Mic} label=${label}/>`}</div>
    ${hint && html`<p className="hint" id=${id + '-hint'}>${hint}</p>`}
    <textarea id=${id} ref=${inputRef} rows=${rows || 3} value=${value} onChange=${e => onChange(e.target.value)}
      aria-required=${required ? 'true' : undefined} aria-invalid=${error ? 'true' : undefined}
      aria-describedby=${describedBy(id, hint, error)} />
    <${FieldError} id=${id} error=${error}/>
  </div>`;
}
function Input({ id, label, value, onChange, type, hint, error, required, className, srLabel, ...rest }) {
  return html`<div className=${'field ' + (className || '')}>
    <label htmlFor=${id} className=${srLabel ? 'sr-only' : undefined}>${label}${required && html`<span className="req" aria-hidden="true">*</span>`}</label>
    ${hint && html`<p className="hint" id=${id + '-hint'}>${hint}</p>`}
    <input id=${id} type=${type || 'text'} value=${value} onChange=${e => onChange(e.target.value)}
      aria-required=${required ? 'true' : undefined} aria-invalid=${error ? 'true' : undefined}
      aria-describedby=${describedBy(id, hint, error)} ...${rest}/>
    <${FieldError} id=${id} error=${error}/>
  </div>`;
}
function Select({ id, label, value, onChange, options, placeholder, hint, error, required, className, srLabel }) {
  return html`<div className=${'field ' + (className || '')}>
    <label htmlFor=${id} className=${srLabel ? 'sr-only' : undefined}>${label}${required && html`<span className="req" aria-hidden="true">*</span>`}</label>
    ${hint && html`<p className="hint" id=${id + '-hint'}>${hint}</p>`}
    <select id=${id} value=${value} onChange=${e => onChange(e.target.value)} aria-invalid=${error ? 'true' : undefined}
      aria-required=${required ? 'true' : undefined} aria-describedby=${describedBy(id, hint, error)}>
      ${placeholder && html`<option value="">${placeholder}</option>`}
      ${options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return html`<option key=${v} value=${v}>${l}</option>`; })}
    </select>
    <${FieldError} id=${id} error=${error}/>
  </div>`;
}

function TopBar() {

    const i = SCALES.indexOf(S.textScale);

  return html`<header className="topbar" ref=${ref}>

      <div className="textsize" role="group" aria-label="Text size">

/* =====================================================================
   Login (static)
   ===================================================================== */
function Login() {
  const u = currentUser();
  const [f, setF] = useState({ pass: 'training-only', method: 'text', sent: false, code: '', err: '' });
  const [user, setUser] = useState(null);
  const username = user === null ? u.user : user;
  const upd = patch => setF(x => ({ ...x, ...patch }));
  const send = () => { upd({ sent: true, code: '482913', err: '' }); };
  const submit = e => {
    e.preventDefault();
    if (!f.sent) { upd({ err: 'Send a verification code first.' }); focusId('send-code'); return; }
    if (!/^\d{6}$/.test(f.code)) { upd({ err: 'Enter the 6-digit code.' }); focusId('code'); return; }
    S.loggedIn = true; S.pendingFocus = true;
    toast(`Signed in as ${u.name}.`);
  };
  return html`<div className="login">
    <form className="panel login-card stack" onSubmit=${submit} noValidate>
      <div>
        <p className="eyebrow">${S.role === 'student' ? 'Student sign-in' : 'Instructor sign-in'}</p>
        <h1 tabIndex="-1">Sign in to the Educational EMR</h1>
        <p className="muted small" style=${{ marginTop: '.35rem' }}>All patients here are fictional. Use the role switcher above to sign in as a student or an instructor.</p>
      </div>
      <${Input} id="username" label="Username" value=${username} onChange=${setUser} autoComplete="username"/>
      <${Input} id="password" label="Password" type="password" value=${f.pass} onChange=${v => upd({ pass: v })} autoComplete="current-password"/>
      <fieldset className="stack" style=${{ gap: '.5rem' }}>
        <legend className="flabel" style=${{ marginBottom: '.4rem' }}>Verification code</legend>
        <div className="radio-row">
          <span className="check"><input type="radio" id="m-text" name="method" checked=${f.method === 'text'} onChange=${() => upd({ method: 'text', sent: false, code: '' })}/><label htmlFor="m-text">Text •••-•••-4417</label></span>
          <span className="check"><input type="radio" id="m-email" name="method" checked=${f.method === 'email'} onChange=${() => upd({ method: 'email', sent: false, code: '' })}/><label htmlFor="m-email">Email ${username.charAt(0)}•••••@miners.utep.edu</label></span>
        </div>
        <div><button type="button" id="send-code" className="btn btn-secondary" onClick=${send}><${Icon} name="send" size=${15}/>${f.sent ? 'Resend code' : 'Send verification code'}</button></div>
        ${f.sent && html`<p className="code-sent" role="status"><${Icon} name="checkCircle" size=${16}/>Code sent by ${f.method}. For the demo, it has been filled in for you.</p>`}
        ${f.sent && html`<${Input} id="code" label="6-digit code" className="code-field" value=${f.code} onChange=${v => upd({ code: v.replace(/\D/g, '').slice(0, 6) })}
          inputMode="numeric" autoComplete="one-time-code" maxLength="6"/>`}
      </fieldset>
      ${f.err && html`<p className="err" role="alert"><${Icon} name="alert" size=${14}/>${f.err}</p>`}
      <button type="submit" className="btn btn-primary">Log in</button>
      <p className="hint">Goes to ${S.role === 'student' ? 'class selection' : 'the instructor dashboard'}.</p>
    </form>
  </div>`;
}

  const nav = S.nav.student;
  const me = currentUser();
  const mine = S.assignments.filter(a => a.studentId === me.id);
  const myCourses = COURSES.filter(c => mine.some(a => a.course === c.id) || c.id === 'PHAR5310');
  const rows = mine.filter(a => a.course === nav.course);
  const returned = rows.filter(a => a.note.status === 'Returned');
  const actionLabel = s => (s === 'Not started' ? 'Open' : (s === 'Draft' || s === 'Returned') ? 'Continue' : 'View');
  return html`<div>
    <div className="page-head">
      <div><p className="eyebrow">${me.name} · ${me.sid} · ${me.program}</p><h1 tabIndex="-1">My cases</h1></div>
      <${Select} id="course" label="Course" value=${nav.course} onChange=${v => { nav.course = v; commit(); }}
        options=${myCourses.map(c => [c.id, c.label])} className="course-pick"/>
    </div>
    ${returned.length > 0 && html`<div className="callout callout-returned" style=${{ marginBottom: '1rem' }}>
      <div className="callout-head"><${Icon} name="undo" size=${20}/><div>
        <h2>${plural(returned.length, 'note')} returned — revisions requested</h2>
        <p>Your instructor left comments. Open the case, read the comments, and choose Revise.</p></div></div></div>`}
    <div className="table-wrap">
      <table>
        <caption>Assigned cases · ${courseLabel(nav.course)}</caption>
        <thead><tr><th scope="col">Patient</th><th scope="col">Chief complaint</th><th scope="col">Mode</th><th scope="col">Assigned by</th><th scope="col">Due date</th><th scope="col">Note status</th><th scope="col">Action</th></tr></thead>
        <tbody>
          ${rows.length === 0 && html`<tr><td colSpan="7"><div className="empty">No cases assigned in this course yet.</div></td></tr>`}
          ${rows.map(a => {
            const p = patientOf(a); const s = a.note.status; const lbl = actionLabel(s);
            return html`<tr key=${a.id} className=${s === 'Returned' ? 'row-flag' : ''}>
              <td><strong>${p.last}, ${p.first}</strong><span className="cell-sub">${ageFrom(p.dob)} y · ${p.sex.charAt(0)} · <span className="mono">${p.mrn}</span></span></td>
              <td style=${{ maxWidth: '22rem' }}>${p.cc}</td>
              <td><${ModeBadge} mode=${a.mode}/></td>
              <td>${person(a.assignedBy).short}</td>
              <td className="num">${isoToLong(a.due)}</td>
              <td><${NoteBadge} status=${s} studentView=${true}/></td>
              <td><button type="button" className=${'btn btn-sm ' + (lbl === 'View' ? 'btn-secondary' : 'btn-primary')} onClick=${() => openChart(a)}>
                ${lbl}<span className="sr-only"> case for ${p.first} ${p.last}</span></button></td>

  </div>`;
}

const STUDENT_TABS = [['summary', 'Summary'], ['note', 'Encounter note'], ['meds', 'Medications'], ['allergies', 'Allergies'], ['problems', 'Problems/History'], ['vitals', 'Vitals'], ['labs', 'Labs/Results'], ['referrals', 'Referrals'], ['versions', 'Version history']];
const INSTR_TABS = [['note', 'Note review'], ['summary', 'Summary'], ['meds', 'Medications'], ['allergies', 'Allergies'], ['problems', 'Problems/History'], ['vitals', 'Vitals'], ['labs', 'Labs/Results'], ['referrals', 'Referrals'], ['versions', 'Version history & audit']];

function Stepper({ current }) {
  const idx = ENC.indexOf(current);
  return html`<div className="stepper-wrap">
    <span className="stepper-label" id="enc-lbl">Encounter</span>
    <ol className="stepper" aria-labelledby="enc-lbl">

}

function PatientBanner({ a }) {

        ${canStart && html`<button type="button" className="btn btn-primary" onClick=${() => startEncounter(a)}>
          <${Icon} name="play" size=${14}/>${a.encounter === 'Scheduled' ? 'Check in patient' : 'Start encounter'}</button>`}
      </div>
    </div>
  </section>`;
}

function Chart({ a }) {
  const role = S.role;
  const nav = S.nav[role];
  const tabs = role === 'student' ? STUDENT_TABS : INSTR_TABS;
  const tab = tabs.some(t => t[0] === nav.tab) ? nav.tab : tabs[0][0];
  const n = a.note;
  const onKey = (e, i) => {
    let j = null;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') j = (i + 1) % tabs.length;
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = tabs.length - 1;
    if (j !== null) { e.preventDefault(); setTab(tabs[j][0]); setTimeout(() => document.getElementById('tab-' + tabs[j][0])?.focus(), 0); }
  };
  const flag = t => {
    if (t !== 'note') return null;
    if (role === 'instructor' && n.status === 'Pending review') return html`<span className="tab-flag"><${Icon} name="clock" size=${14} label="Pending review"/></span>`;
    if (role === 'student' && n.status === 'Returned') return html`<span className="tab-flag"><${Icon} name="undo" size=${14} label="Returned"/></span>`;
    if (n.status === 'Final') return html`<span className="tab-flag"><${Icon} name="lock" size=${14} label="Locked"/></span>`;
    return null;
  };
  let panel;
  if (tab === 'summary') panel = html`<${Summary} a=${a}/>`;
  else if (tab === 'note') panel = role === 'student' ? html`<${StudentNote} a=${a}/>` : html`<${InstructorNote} a=${a}/>`;
  else if (tab === 'meds') panel = html`<${MedsTab} a=${a}/>`;
  else if (tab === 'allergies') panel = html`<${AllergiesTab} a=${a}/>`;
  else if (tab === 'problems') panel = html`<${ProblemsTab} a=${a}/>`;
  else if (tab === 'vitals') panel = html`<${VitalsTab} a=${a}/>`;
  else if (tab === 'labs') panel = html`<${LabsTab} a=${a}/>`;
  else if (tab === 'referrals') panel = html`<${ReferralsTab} a=${a}/>`;
  else panel = html`<${Versions} a=${a}/>`;
  return html`<div>
    <div className="crumbs">
      <button type="button" className="btn btn-link" onClick=${() => go({ screen: role === 'student' ? 'cases' : 'dash' })}>
        <${Icon} name="arrowLeft" size=${15}/>${role === 'student' ? 'My cases' : 'Instructor dashboard'}</button>
      <span className="muted">/ ${personName(a.studentId)} · ${courseShort(a.course)}</span>
    </div>
    <${PatientBanner} a=${a}/>
    <div className="chart-body">

function StudentNote({ a }) {
  const n = a.note;
  if ((a.encounter === 'Scheduled' || a.encounter === 'Checked in') && n.status === 'Not started') {
    return html`<div className="panel"><div className="empty">
      <${Icon} name="play" size=${28}/>
      <h2>Start the encounter to begin your note</h2>
      <p>The patient is ${a.encounter.toLowerCase()}. Starting the encounter moves its status to In progress.</p>
      <button type="button" className="btn btn-primary" onClick=${() => startEncounter(a)}><${Icon} name="play" size=${14}/>${a.encounter === 'Scheduled' ? 'Check in patient' : 'Start encounter'}</button>
    </div></div>`;
  }
  if (n.status === 'Pending review') {
    const ev = lastEvent(n, ['Submitted', 'Resubmitted']);
    return html`<div className="stack">
      <div className="callout callout-warn"><div className="callout-head"><${Icon} name="clock" size=${20}/><div>
        <h2>Pending review · read-only</h2>
        <p>You signed v${n.version} and sent it to ${personName(n.routeTo)} on ${fmtDT(ev.t)}. You can't edit the note while it is under review.</p></div>
        <${NoteBadge} status=${n.status}/></div></div>
      <${NoteView} a=${a} data=${n.data}/>
    </div>`;
  }
  if (n.status === 'Final') return html`<${FinalNote} a=${a}/>`;
  if (n.status === 'Returned') {
    const cs = n.comments.filter(c => c.round === n.round);
    return html`<div className="stack">
      <${ReturnedBanner} a=${a} comments=${cs}/>
      ${n.revising ? html`<${NoteEditor} a=${a} comments=${cs}/>` : html`<${NoteView} a=${a} data=${n.data} comments=${cs}/>`}
    </div>`;
  }
  return html`<${NoteEditor} a=${a}/>`;
}

function ReturnedBanner({ a, comments }) {
  const n = a.note;
  const ev = lastEvent(n, ['Returned']);
  const jump = k => e => { e.preventDefault(); focusId('h-' + k); };
  return html`<div className="callout callout-returned" role="region" aria-labelledby="ret-h">
    <div className="callout-head"><${Icon} name="undo" size=${22}/>
      <div><h2 id="ret-h">Returned — revisions requested</h2>
        <p>${personName(ev.by)} returned v${ev.v} on ${fmtDT(ev.t)} with ${plural(comments.length, 'comment')}.
          ${n.revising ? ` You are revising v${n.version}.` : ' Choose Revise to unlock editing. Your changes are saved as a new version.'}</p></div>
      ${n.revising
        ? html`<span className="badge b-accent badge-lg"><${Icon} name="pencil" size=${14}/>Revising v${n.version}</span>`
        : html`<button type="button" className="btn btn-primary" onClick=${() => reviseNote(a)}><${Icon} name="pencil" size=${15}/>Revise</button>`}
    </div>
    <ul className="comment-list">
      ${comments.map(c => html`<li key=${c.id}><a href=${'#sec-' + c.section} onClick=${jump(c.section)}>${SEC[c.section]}</a>: ${c.text}</li>`)}
    </ul>
  </div>`;
}

function InlineComments({ comments, onRemove }) {
  if (!comments || !comments.length) return null;
  return html`<div className="inline-comments">${comments.map(c => html`<div key=${c.id} className="icomment" role="note">
    <${Icon} name="comment" size=${15}/>
    <div style=${{ flex: 1 }}><span className="icomment-meta">Instructor comment · ${person(c.by).short} · ${fmtDT(c.t)}</span>${c.text}</div>
    ${onRemove && html`<button type="button" className="btn btn-link btn-sm" onClick=${() => onRemove(c)}>Remove<span className="sr-only"> comment</span></button>`}
  </div>`)}</div>`;
}

/* =====================================================================

function SaveIndicator({ n }) {
  return html`<span className="save-ind" role="status">
    ${n.dirty ? html`<${Icon} name="clock" size=${14}/>Saving…`
      : n.lastSaved ? html`<${Icon} name="checkCircle" size=${14}/>Draft saved ${fmtTime(n.lastSaved)}`
      : html`<${Icon} name="dash" size=${14}/>Not saved yet`}
  </span>`;
}

function SoapSection({ k, open, onToggle, comments, children }) {
  return html`<section className="soap" id=${'sec-' + k} aria-labelledby=${'h-' + k}>
    <div className="soap-h">
      <h2 id=${'h-' + k} tabIndex="-1" style=${{ flex: 1, display: 'flex' }}>
        <button type="button" className="soap-toggle" aria-expanded=${open} aria-controls=${'body-' + k} onClick=${onToggle}>
          <span className="soap-letter" aria-hidden="true">${k}</span><span><span className="sr-only">${k} — </span>${SEC[k]}</span>
          <span className="chev"><${Icon} name="chevronDown" size=${18}/></span>
        </button>
      </h2>
    </div>
    <${InlineComments} comments=${(comments || []).filter(c => c.section === k)}/>
    <div id=${'body-' + k} className="soap-body" hidden=${!open}>${children}</div>
  </section>`;
}

function NoteEditor({ a, comments }) {
  const n = a.note, d = n.data, p = patientOf(a);
  const [open, setOpen] = useState({ S: true, O: true, A: true, P: true });
  const hpiRef = useRef();
  const errs = n.showErrors ? validate(d) : {};
  const errList = Object.entries(errs);
  const upd = fn => { fn(d); touch(a); };
  const tpl = TEMPLATES.find(t => t.id === n.template);
  const toggle = k => () => setOpen(o => ({ ...o, [k]: !o[k] }));

  const onSign = () => {
    n.showErrors = true;
    const e = validate(d);
    if (Object.keys(e).length) {
      setOpen({ S: true, O: true, A: true, P: true });
      commit(); focusId('err-summary'); return;
    }
    S.modal = { type: 'sign', a }; commit();
  };
  const addOldcarts = label => {
    upd(x => { x.hpi = (x.hpi && !x.hpi.endsWith('\n') ? x.hpi + '\n' : x.hpi) + label + ': '; });
    setTimeout(() => { const t = hpiRef.current; if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 0);
  };
  const addProblem = x => {
    if (d.problems.some(pr => pr.code === x.code)) { toast(`${x.code} is already on the problem list.`, 'info'); return; }
    upd(dd => dd.problems.push({ code: x.code, desc: x.desc, rationale: '' }));
    focusId('rat-' + x.code, true);
  };
  const moveProblem = (i, dir) => {
    const j = i + dir; if (j < 0 || j >= d.problems.length) return;
    upd(dd => { const t = dd.problems[i]; dd.problems[i] = dd.problems[j]; dd.problems[j] = t; });
  };
  const removeProblem = i => upd(dd => { const [pr] = dd.problems.splice(i, 1); dd.meds.forEach(m => { if (m.problem === pr.code) m.problem = ''; }); });

  const groups = d.problems.map((pr, i) => ({ key: pr.code, title: html`<span className="prio">${i + 1}</span><span className="mono">${pr.code}</span> ${pr.desc}`, meds: d.meds.filter(m => m.problem === pr.code) }));
  const unlinked = d.meds.filter(m => !d.problems.some(pr => pr.code === m.problem));
  if (unlinked.length || !groups.length) groups.push({ key: '_none', title: html`<span>Not linked to a problem</span>`, meds: unlinked });

  return html`<div className="editor">
    <div className="ed-head">
      <${Select} id="template" label="Template" value=${n.template} onChange=${v => { n.template = v; touch(a); }}
        options=${TEMPLATES.map(t => [t.id, t.id])}/>
      <div style=${{ paddingBottom: '.3rem' }}><${NoteBadge} status=${n.status} studentView=${true}/></div>
      <span className="muted small" style=${{ paddingBottom: '.45rem' }}>v${n.version}</span>
      <${SaveIndicator} n=${n}/>
    </div>
    ${tpl.stub && html`<div className="callout callout-info"><div className="callout-head"><${Icon} name="info" size=${18}/><div>
      <h2 style=${{ fontSize: '1rem' }}>${tpl.id} is available as a preview</h2>
      <p>This template will add ${tpl.sections}. In this mockup it uses the General SOAP fields below.</p></div></div></div>`}
    ${errList.length > 0 && html`<div id="err-summary" className="err-summary" role="alert" tabIndex="-1">
      <h2><${Icon} name="alert" size=${18}/>Fix ${plural(errList.length, 'issue')} before you sign</h2>
      <ul>${errList.map(([k, m]) => html`<li key=${k}><a href=${'#' + errTarget(k)} onClick=${e => { e.preventDefault(); focusId(errTarget(k), true); }}>${m}</a></li>`)}</ul>
    </div>`}

    <${SoapSection} k="S" open=${open.S} onToggle=${toggle('S')} comments=${comments}>
      <${Input} id="cc" label="Chief complaint" value=${d.cc} onChange=${v => upd(x => { x.cc = v; })} hint="Prefilled from the case. Edit to match the patient's own words."/>
      <div className="stack" style=${{ gap: '.5rem' }}>
        <${TextArea} id="hpi" label="History of present illness (HPI)" rows=${7} value=${d.hpi} onChange=${v => upd(x => { x.hpi = v; })} inputRef=${hpiRef}
          hint="Use the OLDCARTS prompts below to add a labeled line."/>
        <div role="group" aria-label="OLDCARTS prompts">
          <ul className="oldcarts">${OLDCARTS.map(([L, w, h]) => html`<li key=${w}>
            <button type="button" className="oc-btn" onClick=${() => addOldcarts(w)}><b><u>${L}</u>${w.slice(1)}</b><span>${h}</span></button></li>`)}</ul>
        </div>
      </div>
      <div className="grid-2">
        <${TextArea} id="pmh" label="Past medical history (PMH)" value=${d.pmh} onChange=${v => upd(x => { x.pmh = v; })}/>
        <${TextArea} id="psh" label="Past surgical history (PSH)" value=${d.psh} onChange=${v => upd(x => { x.psh = v; })}/>
      </div>
      <div className="stack" style=${{ gap: '.45rem' }}>
        <h3 className="sub-h"><${Icon} name="pill" size=${14}/>Medications from chart <span style=${{ textTransform: 'none', letterSpacing: 0, fontWeight: 400 }}>· read-only</span></h3>
        <div className="table-wrap"><table className="med-table">
          <thead><tr><th scope="col">Medication</th><th scope="col">Sig</th><th scope="col">Reconcile</th></tr></thead>
          <tbody>${p.meds.map(m => html`<tr key=${m.id}><td><strong>${m.name} ${m.dose}</strong></td><td>${m.route} · ${m.freq}</td>
            <td><span className="check"><input type="checkbox" id=${'rec-' + m.id} checked=${!!d.reconciled[m.id]} onChange=${e => upd(x => { x.reconciled[m.id] = e.target.checked; })}/>
              <label htmlFor=${'rec-' + m.id} className="small">Reconciled<span className="sr-only"> ${m.name}</span></label></span></td></tr>`)}</tbody>
        </table></div>
      </div>
      <div className="stack" style=${{ gap: '.45rem' }}>
        <h3 className="sub-h"><${Icon} name="alert" size=${14}/>Allergies <span style=${{ textTransform: 'none', letterSpacing: 0, fontWeight: 400 }}>· read-only</span></h3>
        <div className="row"><${AllergyChips} p=${p}/></div>
      </div>
      <div className="grid-2">
        <${TextArea} id="fhx" label="Family history" value=${d.fhx} onChange=${v => upd(x => { x.fhx = v; })}/>
        <${TextArea} id="shx" label="Social history" value=${d.shx} onChange=${v => upd(x => { x.shx = v; })}/>
      </div>
    <//>

    <${SoapSection} k="O" open=${open.O} onToggle=${toggle('O')} comments=${comments}>
      <div className="stack" style=${{ gap: '.5rem' }}>
        <h3 className="sub-h"><${Icon} name="heart" size=${14}/>Vitals <span style=${{ textTransform: 'none', letterSpacing: 0, fontWeight: 400 }}>· pulled from today's intake; edit if you re-measured</span></h3>
        <div className="vitals">
          ${[['bp', 'BP (mmHg)'], ['hr', 'HR (bpm)'], ['rr', 'RR (/min)'], ['temp', 'Temp (°F)'], ['spo2', 'SpO₂ (%)'], ['ht', 'Height (in)'], ['wt', 'Weight (lb)']].map(([k, l]) =>
            html`<${Input} key=${k} id=${'v-' + k} label=${l} value=${d.vitals[k]} onChange=${v => upd(x => { x.vitals[k] = v; })} inputMode=${k === 'bp' ? 'text' : 'decimal'}/>`)}
          <div className="field"><span className="flabel" id="bmi-l">BMI (kg/m²)</span>
            <output className="bmi-out" aria-labelledby="bmi-l" aria-describedby="bmi-h">${bmi(d.vitals.ht, d.vitals.wt) || '—'}</output>
            <p className="hint" id="bmi-h">Auto-calculated from height and weight</p></div>
        </div>
      </div>
      <div className="stack" style=${{ gap: '.5rem' }}>
        <h3 className="sub-h"><${Icon} name="clipboard" size=${14}/>Physical exam by system</h3>
        <ul className="exam">${SYSTEMS.map(sys => {
          const ex = d.exam[sys]; const id = 'ex-' + sys.replace(/\W/g, '');
          return html`<li key=${sys}>
            <span className="sys" id=${id + '-l'}>${sys}</span>
            <button type="button" className="wnl" aria-pressed=${ex.wnl} onClick=${() => upd(x => { x.exam[sys].wnl = !x.exam[sys].wnl; })}>
              <${Icon} name=${ex.wnl ? 'check' : 'dash'} size=${13}/>WNL<span className="sr-only"> for ${sys}</span></button>
            <label htmlFor=${id} className="sr-only">${sys} findings</label>
            <input id=${id} type="text" value=${ex.text} placeholder=${ex.wnl ? 'Within normal limits. Add details if needed.' : 'Describe findings'}
              onChange=${e => upd(x => { x.exam[sys].text = e.target.value; })}/>
          </li>`;
        })}</ul>

function RxRow({ m, onRemove }) {
  return html`<li className="rx">
    <span className=${'act act-' + m.action.toLowerCase()}>${m.action}</span>
    <span className="rx-main"><strong>${m.drug} ${m.dose}</strong> <span className="muted">${m.route} · ${m.freq} · ${m.duration}</span></span>
    ${onRemove && html`<button type="button" className="btn btn-link btn-sm" onClick=${onRemove}>Remove<span className="sr-only"> ${m.drug} from plan</span></button>`}
    ${m.override && html`<span className="rx-override"><${Icon} name="alert" size=${14}/>Allergy alert overridden: ${m.override}</span>`}
  </li>`;
}

function IcdSearch({ onPick, added, error }) {
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const [act, setAct] = useState(0);
  const term = q.trim().toLowerCase();
  const res = term ? ICD10.filter(x => (x.code + ' ' + x.desc).toLowerCase().includes(term)) : [];
  const show = open && term.length > 0;
  const choose = x => { onPick(x); setQ(''); setOpen(false); setAct(0); };
  const onKey = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setOpen(true); setAct(i => Math.min(i + 1, res.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setAct(i => Math.max(i - 1, 0)); }
    else if (e.key === 'Enter') { if (show && res[act]) { e.preventDefault(); choose(res[act]); } }
    else if (e.key === 'Escape') { setOpen(false); }
  };
  return html`<div className="field combo">
    <label htmlFor="icd-search">Add a diagnosis (ICD-10 search)</label>
    <p className="hint" id="icd-search-hint">Type a code or term, for example "diab". Use the arrow keys and Enter to select.</p>
    <input id="icd-search" type="text" role="combobox" autoComplete="off" value=${q}
      aria-expanded=${show} aria-controls="icd-list" aria-autocomplete="list"
      aria-activedescendant=${show && res[act] ? 'icd-opt-' + act : undefined}
      aria-describedby=${describedBy('icd-search', true, error)} aria-invalid=${error ? 'true' : undefined}
      onChange=${e => { setQ(e.target.value); setOpen(true); setAct(0); }} onKeyDown=${onKey}
      onFocus=${() => setOpen(true)} onBlur=${() => setOpen(false)}/>
    <${FieldError} id="icd-search" error=${error}/>
    ${show && html`<ul className="combo-list" role="listbox" id="icd-list" aria-label="Matching ICD-10 codes">
      ${res.length ? res.map((x, i) => html`<li key=${x.code} id=${'icd-opt-' + i} role="option" aria-selected=${i === act}
          className=${added.includes(x.code) ? 'added' : ''} onMouseDown=${e => e.preventDefault()} onMouseEnter=${() => setAct(i)} onClick=${() => choose(x)}>
          <span className="mono">${x.code}</span><span>${x.desc}${added.includes(x.code) ? ' (already added)' : ''}</span></li>`)
        : html`<li className="none" role="option" aria-selected="false" aria-disabled="true">No matching codes in this training code set.</li>`}
    </ul>`}
    <p className="sr-only" role="status">${show ? plural(res.length, 'result') : ''}</p>
  </div>`;
}

function MedPicker({ a, error }) {
  const n = a.note, d = n.data, p = patientOf(a);
  const firstProblem = () => (d.problems[0] ? d.problems[0].code : '');
  const blank = () => ({ drugId: '', dose: '', route: 'PO', freq: 'Once daily', duration: 'Ongoing', action: 'Start', problem: firstProblem(), override: '' });
  const [m, setM] = useState(blank);
  const [err, setErr] = useState('');
  const drug = byId(DRUGS, m.drugId);
  const current = drug && p.meds.find(x => x.name === drug.name);
  useEffect(() => { if (!m.problem && d.problems.length) setM(x => ({ ...x, problem: firstProblem() })); }, [d.problems.length]);

  const pick = id => {
    setErr('');
    const dr = byId(DRUGS, id);
    if (!dr) { setM(x => ({ ...blank(), problem: x.problem })); return; }
    const cur = p.meds.find(x => x.name === dr.name);
    const next = { drugId: id, dose: cur && dr.strengths.includes(cur.dose) ? cur.dose : dr.strengths[0], route: dr.route,
      freq: cur ? cur.freq : dr.freq, duration: 'Ongoing', action: cur ? 'Continue' : 'Start', problem: m.problem || firstProblem(), override: '' };
    setM(next);
    if (dr.penicillin && hasPcnAllergy(p)) {
      audit(a, 'Allergy alert', `Penicillin allergy alert shown for ${dr.name}`);
      S.modal = {
        type: 'allergy', drug: dr, patient: p,
        onCancel: () => { setM(x => ({ ...blank(), problem: x.problem })); audit(a, 'Allergy alert', `${dr.name} cancelled after allergy alert`); },
        onOverride: reason => { setM(x => ({ ...x, override: reason })); audit(a, 'Allergy alert', `${dr.name} allergy alert overridden: ${reason}`); },
      };
      commit();
    }
  };
  const setDose = v => setM(x => ({ ...x, dose: v, action: current && x.action === 'Continue' && v !== current.dose ? 'Adjust' : x.action }));
  const add = () => {
    if (!drug) { setErr('Choose a drug to add.'); focusId('drug-select'); return; }
    d.meds.push({ id: uid('rx'), drug: drug.name, dose: m.dose, route: m.route, freq: m.freq, duration: m.duration, action: m.action, problem: m.problem, override: m.override });
    touch(a);
    toast(`${m.action}: ${drug.name} ${m.dose} added to the plan.`);
    setM(x => ({ ...blank(), problem: x.problem }));
    focusId('drug-select');
  };
  const shownErr = err || error;
  return html`<fieldset className="picker">
    <legend>Add medication</legend>
    <div className="picker-grid">
      <${Select} id="drug-select" label="Drug" value=${m.drugId} onChange=${pick} placeholder="Choose from drug list" options=${DRUGS.map(x => [x.id, x.label])} error=${shownErr}/>
      <${Select} id="rx-problem" label="For problem" value=${m.problem} onChange=${v => setM(x => ({ ...x, problem: v }))}
        placeholder=${d.problems.length ? 'Not linked' : 'Add a problem in Assessment first'} options=${d.problems.map((pr, i) => [pr.code, `#${i + 1} ${pr.code}`])}/>
      <${Select} id="rx-dose" label="Dose" value=${m.dose} onChange=${setDose} options=${drug ? drug.strengths : []} placeholder=${drug ? undefined : '—'}/>
      <${Select} id="rx-route" label="Route" value=${m.route} onChange=${v => setM(x => ({ ...x, route: v }))} options=${ROUTES}/>
      <${Select} id="rx-freq" label="Frequency" value=${m.freq} onChange=${v => setM(x => ({ ...x, freq: v }))} options=${FREQS}/>
      <${Select} id="rx-duration" label="Duration" value=${m.duration} onChange=${v => setM(x => ({ ...x, duration: v }))} options=${DURATIONS}/>
      <${Select} id="rx-action" label="Action" value=${m.action} onChange=${v => setM(x => ({ ...x, action: v }))} options=${RX_ACTIONS}
        hint=${current ? `On chart: ${current.name} ${current.dose} ${current.freq.toLowerCase()}` : undefined}/>
      <div className="field" style=${{ justifyContent: 'flex-end' }}>
        <button type="button" className="btn btn-primary" onClick=${add}><${Icon} name="plus" size=${15}/>Add to plan</button>
      </div>
    </div>
    ${m.override && html`<p className="rx-override" style=${{ display: 'flex', gap: '.35rem', color: 'var(--crit)', fontSize: '.85rem', fontWeight: 500 }}>
      <${Icon} name="alert" size=${14}/>Allergy alert overridden. Reason: ${m.override}</p>`}
  </fieldset>`;
}

    const e = {};
    if (!spec) e.spec = 'Choose a specialty.';
    if (!reason.trim()) e.reason = 'Enter a reason for the referral.';
    setErr(e);
    if (Object.keys(e).length) { focusId(e.spec ? 'ref-spec' : 'ref-reason'); return; }
    d.referrals.push({ id: uid('rf'), specialty: spec, reason: reason.trim() }); touch(a);
    toast(`Referral to ${spec} added.`);

  return html`<div className="stack" style=${{ gap: '.6rem' }}>

    <fieldset className="picker">
      <legend>Add referral</legend>
      <div className="grid-3">
        <${Select} id="ref-spec" label="Specialty" value=${spec} onChange=${setSpec} placeholder="Choose a specialty" options=${SPECIALTIES} error=${err.spec}/>
        <${Input} id="ref-reason" label="Reason" value=${reason} onChange=${setReason} error=${err.reason} placeholder="e.g. Medical nutrition therapy"/>
        <div className="field" style=${{ justifyContent: 'flex-end' }}><button type="button" className="btn btn-secondary" onClick=${add}><${Icon} name="plus" size=${15}/>Add referral</button></div>

  const p = patientOf(a);
  const pre = idPrefix || '';
  const nd = txt => (txt && String(txt).trim() ? txt : html`<span className="nd">Not documented</span>`);
  const fu = d.followup === 'custom' ? (d.followupCustom || 'Custom') : (FOLLOWUPS.find(f => f[0] === d.followup) || [0, ''])[1];
  const sec = (k, body) => html`<section className="soap" id=${pre ? undefined : 'sec-' + k} aria-labelledby=${pre + 'h-' + k}>
    <div className="soap-h view-h">
      <h2 id=${pre + 'h-' + k} tabIndex="-1"><span className="soap-letter" aria-hidden="true">${k}</span><span><span className="sr-only">${k} — </span>${SEC[k]}</span></h2>
      ${onComment && html`<button type="button" className="btn btn-secondary btn-sm" onClick=${() => onComment(k)}><${Icon} name="comment" size=${14}/>Add comment<span className="sr-only"> on ${SEC[k]}</span></button>`}
    </div>
    <${InlineComments} comments=${(comments || []).filter(c => c.section === k)} onRemove=${onRemoveComment}/>
    <div className="soap-body">${body}</div>
  </section>`;
  const groups = d.problems.map((pr, i) => ({ key: pr.code, title: `#${i + 1} ${pr.code} — ${pr.desc}`, meds: d.meds.filter(m => m.problem === pr.code) }));
  const unlinked = d.meds.filter(m => !d.problems.some(pr => pr.code === m.problem));
  if (unlinked.length) groups.push({ key: '_none', title: 'Not linked to a problem', meds: unlinked });
  return html`<div className="stack">
    ${sec('S', html`<dl className="dl-note">
      <dt>Chief complaint</dt><dd>${nd(d.cc)}</dd>
      <dt>HPI</dt><dd>${nd(d.hpi)}</dd>
      <dt>PMH</dt><dd>${nd(d.pmh)}</dd>
      <dt>PSH</dt><dd>${nd(d.psh)}</dd>
      <dt>Medications</dt><dd><ul className="plain-list">${p.meds.map(m => html`<li key=${m.id}>${m.name} ${m.dose} ${m.route} ${m.freq.toLowerCase()} ·
        ${d.reconciled[m.id] ? html`<span className="badge b-ok" style=${{ marginLeft: '.2rem' }}><${Icon} name="check" size=${12}/>Reconciled</span>` : html`<span className="badge b-neutral" style=${{ marginLeft: '.2rem' }}><${Icon} name="dash" size=${12}/>Not reconciled</span>`}</li>`)}</ul></dd>
      <dt>Allergies</dt><dd><div className="row"><${AllergyChips} p=${p}/></div></dd>
      <dt>Family history</dt><dd>${nd(d.fhx)}</dd>
      <dt>Social history</dt><dd>${nd(d.shx)}</dd>
    </dl>`)}
    ${sec('O', html`<dl className="dl-note">
      <dt>Vitals</dt><dd><div className="vit-inline">
        <span><b>BP</b>${d.vitals.bp}</span><span><b>HR</b>${d.vitals.hr}</span><span><b>RR</b>${d.vitals.rr}</span><span><b>Temp</b>${d.vitals.temp}°F</span>
        <span><b>SpO₂</b>${d.vitals.spo2}%</span><span><b>Ht</b>${d.vitals.ht} in</span><span><b>Wt</b>${d.vitals.wt} lb</span><span><b>BMI</b>${bmi(d.vitals.ht, d.vitals.wt) || '—'}</span></div></dd>
      <dt>Physical exam</dt><dd><ul className="plain-list">${SYSTEMS.map(s => { const ex = d.exam[s]; return html`<li key=${s}><strong>${s}:</strong> ${ex.wnl ? 'WNL' : ''}${ex.wnl && ex.text ? '. ' : ''}${ex.text}${!ex.wnl && !ex.text ? html`<span className="nd">Not examined</span>` : ''}</li>`; })}</ul></dd>
      <dt>Labs</dt><dd>${p.labs.length ? html`<ul className="plain-list">${p.labs.map(l => html`<li key=${l.name}>${l.name}: <span className=${l.unit ? 'mono' : undefined}>${l.result}${l.unit === '%' ? '%' : l.unit ? ' ' + l.unit : ''}</span> ${l.flag === 'High' ? html`<${FlagBadge} flag="High"/>` : ''}</li>`)}</ul>` : nd('')}</dd>
    </dl>`)}
    ${sec('A', d.problems.length ? html`<ol className="problems">${d.problems.map((pr, i) => html`<li key=${pr.code} className="problem">
        <div className="problem-top"><span className="prio" aria-hidden="true">${i + 1}</span><span className="sr-only">Priority ${i + 1}: </span><span className="mono">${pr.code}</span><span className="desc">${pr.desc}</span></div>

    ${sec('P', html`<div className="stack" style=${{ gap: '.8rem' }}>

        <dt>Patient education</dt><dd>${nd(d.education)}</dd>
        <dt>Follow-up</dt><dd>${nd(fu)}</dd>
        <dt>Referrals</dt><dd>${d.referrals.length ? html`<ul className="plain-list">${d.referrals.map(r => html`<li key=${r.id}><strong>${r.specialty}</strong>: ${r.reason}</li>`)}</ul>` : nd('')}</dd>
      </dl>
    </div>`)}
  </div>`;
}

    </div><${NoteBadge} status="Final"/></div></div>
    <${NoteView} a=${a} data=${n.data}/>
    <${Addenda} a=${a}/>

}
function Addenda({ a }) {
  const n = a.note;
  const [open, setOpen] = useState(false);
  const [text, setText] = useState('');
  const [err, setErr] = useState('');
  const save = () => {
    if (!text.trim()) { setErr('Write the addendum text before saving.'); focusId('addendum-text'); return; }
    addAddendum(a, text.trim()); setText(''); setErr(''); setOpen(false);
  };
  return html`<section className="panel panel-pad addenda" aria-labelledby="add-h">
    <div className="row-between"><h2 id="add-h">Addenda (${n.addenda.length})</h2>
      ${!open && html`<button type="button" className="btn btn-primary" onClick=${() => { setOpen(true); focusId('addendum-text'); }}><${Icon} name="plus" size=${15}/>Add addendum</button>`}</div>
    ${n.addenda.length === 0 && !open && html`<p className="muted small">No addenda. Anything added here appears below the note with its author and time.</p>`}
    ${n.addenda.map((ad, i) => html`<article key=${ad.id} className="addendum">
      <div className="addendum-meta"><span className="badge b-accent"><${Icon} name="plus" size=${12}/>Addendum ${i + 1}</span>
        <span>${personName(ad.by)} (${ad.role})</span><span>·</span><time>${fmtDT(ad.t)}</time></div>
      <p>${ad.text}</p></article>`)}
    ${open && html`<div className="stack" style=${{ gap: '.6rem' }}>
      <${TextArea} id="addendum-text" label="Addendum" rows=${3} value=${text} onChange=${setText} error=${err}
        hint="Addenda are appended with your name and the time. They never change the signed note."/>
      <div className="row"><button type="button" className="btn btn-primary" onClick=${save}>Save addendum</button>
        <button type="button" className="btn btn-ghost" onClick=${() => { setOpen(false); setErr(''); }}>Cancel</button></div>
    </div>`}
  </section>`;
}

/* =====================================================================
   Instructor — note tab
   ===================================================================== */
function InstructorNote({ a }) {
  const n = a.note; const st = personName(a.studentId);
  if (n.status === 'Not started') return html`<div className="panel"><div className="empty"><${Icon} name="dash" size=${28}/>
    <h2>${st} hasn't started this note</h2><p>Encounter status: ${a.encounter}.</p></div></div>`;
  if (n.status === 'Draft') return html`<div className="stack">
    <div className="callout callout-info"><div className="callout-head"><${Icon} name="pencil" size=${20}/><div>
      <h2>Draft in progress · not submitted</h2><p>${st} is still writing v${n.version}. Last saved ${n.lastSaved ? fmtDT(n.lastSaved) : 'never'}. You can review it after the student signs and submits.</p></div>
      <${NoteBadge} status=${n.status}/></div></div>
    <${NoteView} a=${a} data=${n.data}/></div>`;
  if (n.status === 'Returned') {
    const ev = lastEvent(n, ['Returned']);
    const cs = n.comments.filter(c => c.round === n.round);
    return html`<div className="stack">
      <div className="callout callout-returned"><div className="callout-head"><${Icon} name="undo" size=${20}/><div>
        <h2>Returned for revision</h2><p>${personName(ev.by)} returned v${ev.v} on ${fmtDT(ev.t)}. Waiting for ${st} to revise and resubmit.${n.revising ? ` Revision v${n.version} is in progress.` : ''}</p></div>
        <${NoteBadge} status=${n.status}/></div></div>
      <${NoteView} a=${a} data=${n.data} comments=${cs}/></div>`;
  }
  if (n.status === 'Final') return html`<${FinalNote} a=${a}/>`;
  return html`<${InstructorReview} a=${a}/>`;
}

const RUBRIC = [
  ['Subjective', 'HPI covers OLDCARTS; medication history reconciled; allergies confirmed.'],
  ['Objective', 'Vitals and pertinent exam documented; relevant labs interpreted.'],
  ['Assessment', 'Problems prioritized; each rationale tied to subjective and objective data.'],

function InstructorReview({ a }) {
  const n = a.note;
  const [sec, setSec] = useState('P');
  const [text, setText] = useState('');
  const [cErr, setCErr] = useState('');
  const [aErr, setAErr] = useState('');
  const taRef = useRef();
  const round = n.round + 1;
  const current = n.comments.filter(c => c.round === round);
  const earlier = n.comments.filter(c => c.round < round);
  const ev = lastEvent(n, ['Submitted', 'Resubmitted']);
  const startComment = k => { setSec(k); setCErr(''); setTimeout(() => { taRef.current?.focus(); taRef.current?.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' }); }, 0); };
  const post = e => {
    e.preventDefault();
    if (!text.trim()) { setCErr('Write a comment before posting.'); taRef.current?.focus(); return; }
    n.comments.push({ id: uid('cm'), section: sec, text: text.trim(), by: currentUserId(), t: now(), round });
    audit(a, 'Commented', `Comment on ${SEC[sec]}`);
    setText(''); setCErr(''); setAErr(''); commit();
  };
  const removeComment = c => { n.comments = n.comments.filter(x => x !== c); commit(); };
  const doReturn = () => {
    if (!current.length) { setAErr('Add at least one comment before returning the note.'); startComment(sec); return; }
    returnNote(a);
  };
  return html`<div className="stack">
    <div className="callout callout-warn"><div className="callout-head"><${Icon} name="clock" size=${20}/><div>
      <h2>Pending review · v${n.version}</h2>
      <p>${ev.action} by ${personName(a.studentId)} on ${fmtDT(ev.t)} and routed to ${personName(n.routeTo)}.${n.round > 0 ? ` This is a resubmission after ${plural(n.round, 'return')}.` : ''}</p></div>
      <${NoteBadge} status=${n.status}/></div></div>
    <div className="review">
      <div className="stack">
        <${NoteView} a=${a} data=${n.data} comments=${current} onComment=${startComment} onRemoveComment=${removeComment}/>
      </div>
      <aside className="review-side" aria-label="Review tools">
        <section className="side-panel" aria-labelledby="cm-h">
          <h2 id="cm-h"><${Icon} name="comment" size=${17}/>Comments</h2>
          <form className="stack" style=${{ gap: '.55rem' }} onSubmit=${post} noValidate>
            <${Select} id="cm-sec" label="Section" value=${sec} onChange=${setSec} options=${Object.entries(SEC).map(([k, v]) => [k, `${k} — ${v}`])}/>
            <${TextArea} id="cm-text" label="Comment" rows=${3} value=${text} onChange=${setText} error=${cErr} inputRef=${taRef}/>
            <div><button type="submit" className="btn btn-primary btn-sm"><${Icon} name="send" size=${14}/>Post comment</button></div>
          </form>
          <div>
            <h3 className="sub-h" style=${{ marginBottom: '.4rem' }}>This review (${current.length})</h3>
            ${current.length ? html`<ul className="thread">${current.map(c => html`<li key=${c.id}>
              <div className="t-meta"><span className="t-sec">${SEC[c.section]}</span><span>${fmtTime(c.t)}</span></div>${c.text}
              <div><button type="button" className="btn btn-link btn-sm" onClick=${() => removeComment(c)}>Remove<span className="sr-only"> comment</span></button></div></li>`)}</ul>`
              : html`<p className="muted small">No comments yet. Use "Add comment" on any section.</p>`}
          </div>
          ${earlier.length > 0 && html`<div>
            <h3 className="sub-h" style=${{ marginBottom: '.4rem' }}>Earlier reviews (${earlier.length})</h3>
            <ul className="thread">${earlier.map(c => html`<li key=${c.id}><div className="t-meta"><span className="t-sec">${SEC[c.section]} · review ${c.round}</span><span>${fmtDate(c.t)}</span></div>${c.text}</li>`)}</ul>
          </div>`}
        </section>
        <details className="side-panel rubric">
          <summary><${Icon} name="list" size=${16}/>Reference rubric<span className="chev"><${Icon} name="chevronDown" size=${16}/></span></summary>
          <p className="rubric-note"><${Icon} name="info" size=${15}/>Record grades in Blackboard/LMS — grades are not stored in the EMR.</p>
          <ol>${RUBRIC.map(([h, t]) => html`<li key=${h}><b>${h}</b>${t}</li>`)}</ol>
        </details>
      </aside>
    </div>
    <div className="footer-bar" role="region" aria-label="Review actions">
      <div className="row">${aErr ? html`<p className="err" role="alert"><${Icon} name="alert" size=${14}/>${aErr}</p>` : html`<span className="muted small">${plural(current.length, 'comment')} in this review</span>`}</div>
      <div className="row">
        <button type="button" className="btn btn-secondary" onClick=${doReturn}><${Icon} name="undo" size=${15}/>Return for revision</button>
        <button type="button" className="btn btn-primary" onClick=${() => { S.modal = { type: 'cosign', a }; commit(); }}><${Icon} name="lock" size=${15}/>Approve & Co-sign</button>
      </div>
    </div>
  </div>`;
}

function formFromCase(c) {
  const p = c.patient;
  return {
    first: p.first, last: p.last, preferred: p.preferred, dob: p.dob, sex: p.sex, gender: p.gender, pronouns: p.pronouns,
    cc: p.cc, narrative: p.narrative,
    meds: p.meds.map(m => ({ name: m.name, dose: m.dose, route: m.route, freq: m.freq })),
    allergies: p.allergies.map(al => ({ agent: al.agent, reaction: al.reaction })),
    labs: p.labs.map(l => ({ name: l.name, result: l.result, unit: l.unit, flag: l.flag })),
    encounter: 'Checked in', mode: c.mode, assign: [], course: c.course, due: c.due,
  };
}
function blankForm() {
  return { first: '', last: '', preferred: '', dob: '', sex: '', gender: '', pronouns: '', cc: '', narrative: '',
    meds: [{ name: '', dose: '', route: 'PO', freq: 'Once daily' }], allergies: [{ agent: '', reaction: '' }],
    labs: [{ name: '', result: '', unit: '', flag: 'Normal' }], encounter: 'Checked in', mode: 'Grading', assign: [], course: 'PHAR5310', due: '2026-10-02' };
}
function buildPatient(f, base) {
  const p = base ? clone(base) : { mrn: 'TRN-000' + (150 + S.cases.length), lifecycle: 'Test/Training', setting: 'Outpatient', problems: [], pmh: '', psh: '', fhx: '', shx: '', vitals: { bp: '', hr: '', rr: '', temp: '', spo2: '', ht: '', wt: '' }, vitalsHistory: [], appointments: [] };
  Object.assign(p, { first: f.first.trim(), last: f.last.trim(), preferred: f.preferred.trim(), dob: f.dob, sex: f.sex, gender: f.gender, pronouns: f.pronouns, cc: f.cc.trim(), narrative: f.narrative.trim() });
  p.meds = f.meds.filter(m => m.name.trim()).map((m, i) => ({ id: 'm' + (i + 1), name: m.name.trim(), dose: m.dose, route: m.route, freq: m.freq, since: '2026', by: 'Case setup' }));
  const oldAl = base ? base.allergies : [];
  p.allergies = f.allergies.filter(x => x.agent.trim()).map(x => { const o = oldAl.find(y => y.agent === x.agent); return { agent: x.agent.trim(), reaction: x.reaction.trim(), severity: o ? o.severity : 'Unknown', type: o ? o.type : 'Drug', verified: o ? o.verified : '2026' }; });
  const oldLabs = base ? base.labs : [];
  p.labs = f.labs.filter(l => l.name.trim()).map(l => { const o = oldLabs.find(y => y.name === l.name); return { name: l.name.trim(), result: l.result, unit: l.unit, ref: o ? o.ref : '—', flag: l.flag, date: o ? o.date : new Date().toISOString().slice(0, 10) }; });
  if (!p.vitalsHistory.length && p.vitals.bp) p.vitalsHistory = [{ date: 'Today (intake)', ...p.vitals }];
  return p;
}

function RowEditor({ title, rows, cols, onChange, addLabel, kind }) {
  const set = (i, k, v) => { const r = rows.map((x, j) => (j === i ? { ...x, [k]: v } : x)); onChange(r); };
  return html`<div className="stack" style=${{ gap: '.4rem' }}>
    <h3 className="sub-h">${title}</h3>
    <div className=${'row-h rowline ' + kind} aria-hidden="true">${cols.map(c => html`<span key=${c.k}>${c.l}</span>`)}<span></span></div>
    <div className="rows">${rows.map((r, i) => html`<div key=${i} className=${'rowline ' + kind}>
      ${cols.map(c => {
        const id = `${kind}-${i}-${c.k}`; const lbl = `${title} row ${i + 1}: ${c.l}`;
        return c.options
          ? html`<div key=${c.k} className="field"><label htmlFor=${id} className="sr-only">${lbl}</label><select id=${id} value=${r[c.k]} onChange=${e => set(i, c.k, e.target.value)}>${c.options.map(o => html`<option key=${o} value=${o}>${o}</option>`)}</select></div>`
          : html`<div key=${c.k} className="field"><label htmlFor=${id} className="sr-only">${lbl}</label><input id=${id} type="text" value=${r[c.k]} placeholder=${c.l} onChange=${e => set(i, c.k, e.target.value)}/></div>`;
      })}
      <button type="button" className="btn btn-ghost btn-icon" onClick=${() => onChange(rows.filter((_, j) => j !== i))} aria-label=${`Remove ${title.toLowerCase()} row ${i + 1}`}><${Icon} name="x" size=${15}/></button>
    </div>`)}</div>
    <div><button type="button" className="btn btn-link btn-sm" onClick=${() => onChange([...rows, Object.fromEntries(cols.map(c => [c.k, c.options ? c.options[0] : '']))])}><${Icon} name="plus" size=${14}/>${addLabel}</button></div>
  </div>`;
}
