              <${Select} id="f-enc" label="Starting encounter status" value=${f.encounter} onChange=${v => upd({ encounter: v })} options=${['Scheduled', 'Checked in']}/>
              <${Select} id="f-course" label="Course" value=${f.course} onChange=${v => upd({ course: v })} options=${COURSES.map(c => [c.id, c.label])}/>
              <${Input} id="f-due" label="Due date" type="date" value=${f.due} onChange=${v => upd({ due: v })}/>
            </div>
            <fieldset><legend className="flabel" style=${{ marginBottom: '.35rem' }}>Mode</legend>
              <div className="radio-row">
                ${[['Grading', 'Grading: isolated copy per student'], ['Practice', 'Practice: shared test patient, no grading']].map(([v, l]) => html`<span key=${v} className="check">
                  <input type="radio" id=${'mode-' + v} name="mode" checked=${f.mode === v} onChange=${() => upd({ mode: v })}/><label htmlFor=${'mode-' + v}>${l}</label></span>`)}
              </div>
            </fieldset>
            <fieldset aria-describedby=${errs.assign ? 'assign-err' : undefined}><legend className="flabel" style=${{ marginBottom: '.35rem' }}>Assign to<span className="req" aria-hidden="true">*</span></legend>
              <div className="student-picks">
                ${STUDENTS.map(s => {
                  const dis = already(s.id);
                  const id = !dis && firstAssignable ? 'assign-first' : 'assign-' + s.id;
                  if (!dis) firstAssignable = false;
                  return html`<span key=${s.id} className="check"><input type="checkbox" id=${id} disabled=${dis} checked=${f.assign.includes(s.id)} onChange=${() => toggleStudent(s.id)}/>
                    <label htmlFor=${id}>${s.name} <span className="mono muted small">${s.sid}</span> <span className="muted small">· ${s.program}${dis ? ' · already assigned this case' : ''}</span></label></span>`;
                })}
              </div>
              ${errs.assign && html`<p className="err" id="assign-err" style=${{ marginTop: '.35rem' }}><${Icon} name="alert" size=${14}/>${errs.assign}</p>`}
            </fieldset>
            ${f.mode === 'Grading'
              ? html`<p className="iso-note"><${Icon} name="user" size=${16}/>Each student receives an isolated copy.</p>`
              : html`<p className="iso-note"><${Icon} name="users" size=${16}/>Students share one practice patient. Their notes are not graded.</p>`}
          </div>
        </fieldset>
        <div className="footer-bar"><span className="muted small">${f.assign.length ? `Assigning to ${f.assign.map(personName).join(', ')}` : 'No students selected'}</span>
          <div className="row"><button type="button" className="btn btn-ghost" onClick=${() => go({ screen: 'dash' })}>Cancel</button>
            <button type="submit" className="btn btn-primary"><${Icon} name="send" size=${15}/>Assign case</button></div></div>
      </form>
      <aside className="side-panel" aria-labelledby="pp-h">
        <h2 id="pp-h"><${Icon} name="flask" size=${17}/>Practice patients</h2>
        <p className="small muted">Practice patients are shared by the whole class. Reset one to undo changes to its chart.</p>
        <ul className="thread">${practice.map(c => html`<li key=${c.id}>
          <div className="row-between"><strong>${c.patient.first} ${c.patient.last}</strong><span className="mono small muted">${c.patient.mrn}</span></div>
          <p className="small muted">${courseShort(c.course)} · ${c.patient.cc}</p>
          ${confirmReset === c.id
            ? html`<div className="stack" style=${{ gap: '.4rem', marginTop: '.4rem' }}><p className="small" role="status">Reset this chart to the original case data? Student notes are kept.</p>
                <div className="row"><button type="button" className="btn btn-primary btn-sm" onClick=${() => doReset(c)}>Confirm reset</button><button type="button" className="btn btn-ghost btn-sm" onClick=${() => setConfirmReset(null)}>Cancel</button></div></div>`
            : html`<div style=${{ marginTop: '.4rem' }}><button type="button" className="btn btn-secondary btn-sm" onClick=${() => setConfirmReset(c.id)}><${Icon} name="reset" size=${14}/>Reset to original<span className="sr-only"> ${c.patient.first} ${c.patient.last}</span></button></div>`}
        </li>`)}</ul>
      </aside>
    </div>
  </div>`;
}

/* =====================================================================
   Modals
   ===================================================================== */
const FOCUSABLE = 'button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function Modal({ title, onClose, children, footer, alert, wide, icon }) {
  const ref = useRef();
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(() => {
    const prev = document.activeElement;
    const el = ref.current;
    const first = el.querySelector('[data-autofocus]') || el.querySelector(FOCUSABLE);
    first && first.focus();
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); closeRef.current(); return; }
      if (e.key !== 'Tab') return;
      const f = [...el.querySelectorAll(FOCUSABLE)].filter(x => x.offsetParent !== null);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    };
    el.addEventListener('keydown', onKey);
    return () => { el.removeEventListener('keydown', onKey); if (prev && document.contains(prev)) setTimeout(() => prev.focus(), 0); };
  }, []);
  return html`<div className="modal-backdrop">
    <div className=${'modal' + (wide ? ' wide' : '')} role=${alert ? 'alertdialog' : 'dialog'} aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-body" ref=${ref}>
      <div className=${'modal-head' + (alert ? ' alert' : '')}>${icon && html`<${Icon} name=${icon} size=${22}/>`}<h2 id="modal-title">${title}</h2>
        ${!alert && html`<button type="button" className="btn btn-ghost btn-icon" onClick=${onClose} aria-label="Close"><${Icon} name="x" size=${16}/></button>`}</div>
      <div className="modal-body" id="modal-body">${children}</div>
      ${footer && html`<div className="modal-foot">${footer}</div>`}
    </div>
  </div>`;
}
function closeModal() { S.modal = null; commit(); }

function AllergyModal({ m }) {
  const [mode, setMode] = useState('choose');
  const [reason, setReason] = useState('');
  const [err, setErr] = useState('');
  const p = m.patient; const al = p.allergies.find(x => /penicillin/i.test(x.agent));
  const cancel = () => { S.modal = null; m.onCancel(); commit(); toast(`${m.drug.name} was not added.`, 'info'); };
  const override = () => {
    if (mode === 'choose') { setMode('reason'); focusId('override-reason'); return; }
    if (!reason.trim()) { setErr('Enter a reason to override the allergy alert.'); focusId('override-reason'); return; }
    S.modal = null; m.onOverride(reason.trim()); commit();
    toast(`Allergy alert overridden for ${m.drug.name}. The reason is recorded with the plan item.`, 'info');
  };
  return html`<${Modal} title="Allergy alert: penicillin" alert=${true} icon="alert" onClose=${cancel}
    footer=${html`<button type="button" className="btn btn-primary" data-autofocus onClick=${cancel}>Cancel</button>
      <button type="button" className="btn btn-danger" onClick=${override}>${mode === 'choose' ? 'Override with reason' : 'Confirm override'}</button>`}>
    <div className="allergy-box"><${Icon} name="alert" size=${22}/><div>
      <p><strong>${p.first} ${p.last}</strong> has a documented allergy to <strong>${al.agent}</strong> (reaction: ${al.reaction}; severity: ${al.severity.toLowerCase()}).</p>
      <p style=${{ marginTop: '.4rem' }}><strong>${m.drug.label}</strong> is a ${m.drug.drugClass}. It can cause the same allergic reaction, including a severe one.</p>
    </div></div>
    <p>Choose a non-penicillin alternative. Override only if you have a documented clinical reason.</p>
    ${mode === 'reason' && html`<${TextArea} id="override-reason" label="Reason for override" required=${true} rows=${3} value=${reason} onChange=${v => { setReason(v); setErr(''); }} error=${err}
      hint="Required. Saved with the plan item and in the audit log."/>`}
  <//>`;
}

function SignModal({ a }) {
  const n = a.note; const p = patientOf(a);
  const [att, setAtt] = useState(false);
  const [to, setTo] = useState(a.assignedBy);
  const [err, setErr] = useState({});
  const confirm = () => {
    const e = {};
    if (!att) e.att = 'Check the attestation to sign the note.';
    if (!to) e.to = 'Choose the instructor to route this note to.';
    setErr(e);
    if (Object.keys(e).length) { focusId(e.att ? 'attest' : 'route'); return; }
    submitNote(a, to); commit();
  };
  return html`<${Modal} title=${n.round > 0 ? 'Sign & resubmit for co-signature' : 'Sign & submit for co-signature'} icon="sign" onClose=${closeModal}
    footer=${html`<button type="button" className="btn btn-ghost" onClick=${closeModal}>Cancel</button>
      <button type="button" className="btn btn-primary" onClick=${confirm}><${Icon} name="sign" size=${15}/>Confirm & sign</button>`}>
    <p>You are signing <strong>v${n.version}</strong> of the encounter note for <strong>${p.first} ${p.last}</strong>. Your signature is an author signature. The note becomes final only after your instructor co-signs it.</p>
    <div className="field">
      <div className="check"><input type="checkbox" id="attest" checked=${att} onChange=${e => { setAtt(e.target.checked); setErr(x => ({ ...x, att: '' })); }}
        aria-invalid=${err.att ? 'true' : undefined} aria-describedby=${err.att ? 'attest-err' : undefined}/>
        <label htmlFor="attest"><strong>I attest this note reflects my own work.</strong></label></div>
      <${FieldError} id="attest" error=${err.att}/>
    </div>
    <${Select} id="route" label="Route to instructor" value=${to} onChange=${setTo} placeholder="Choose an instructor" options=${INSTRUCTORS.map(i => [i.id, `${i.name} · ${i.dept}`])} error=${err.to}/>
    <p className="hint">After you confirm, the note is read-only while it is pending review.</p>
  <//>`;
}

function CosignModal({ a }) {
  const n = a.note;
  return html`<${Modal} title="Approve & co-sign" icon="lock" onClose=${closeModal}
    footer=${html`<button type="button" className="btn btn-ghost" onClick=${closeModal}>Cancel</button>
      <button type="button" className="btn btn-primary" data-autofocus onClick=${() => { cosignNote(a); commit(); }}><${Icon} name="lock" size=${15}/>Approve & Co-sign</button>`}>
    <p>Co-sign v${n.version} of ${personName(a.studentId)}'s note? The note will be <strong>locked</strong> and the encounter will move to <strong>Signed/Closed</strong>.</p>
    <p>After co-signing, corrections can only be added as addenda. The original text is never changed.</p>
  <//>`;
}

function SnapshotModal({ a, ev }) {
  return html`<${Modal} title=${`Snapshot · v${ev.v} · ${ev.action}`} icon="history" wide=${true} onClose=${closeModal}
    footer=${html`<button type="button" className="btn btn-primary" onClick=${closeModal}>Close</button>`}>
    <div className="callout callout-info"><div className="callout-head"><${Icon} name="lock" size=${18}/><div>
      <p><strong>Read-only snapshot.</strong> ${ev.action} by ${personName(ev.by)} on ${fmtDT(ev.t)}.${ev.detail ? ' ' + ev.detail + '.' : ''}</p></div></div></div>
    <${NoteView} a=${a} data=${ev.snap} idPrefix="snap-"/>
  <//>`;
}

function ModalHost() {
  const m = S.modal;
  if (!m) return null;
  if (m.type === 'allergy') return html`<${AllergyModal} m=${m}/>`;
  if (m.type === 'sign') return html`<${SignModal} a=${m.a}/>`;
  if (m.type === 'cosign') return html`<${CosignModal} a=${m.a}/>`;
  if (m.type === 'snapshot') return html`<${SnapshotModal} a=${m.a} ev=${m.ev}/>`;
  return null;
}

function Toasts() {
  return html`<div className="toasts" role="status" aria-live="polite">
    ${S.toasts.map(t => html`<div key=${t.id} className=${'toast t-' + t.kind}><${Icon} name=${t.kind === 'ok' ? 'checkCircle' : 'info'} size=${17}/><span>${t.text}</span></div>`)}
  </div>`;
}

/* =====================================================================
   App
   ===================================================================== */
function App() {
  const [, setTick] = useState(0);
  rerender = () => setTick(t => t + 1);
  useEffect(() => { document.documentElement.style.fontSize = (S.textScale * 100) + '%'; });
  useEffect(() => {
    if (!S.pendingFocus) return;
    S.pendingFocus = false;
    const h = document.querySelector('main h1');
    window.scrollTo(0, 0);
    if (h) h.focus({ preventScroll: true });
  });
  const nav = S.nav[S.role];
  let screen;
  if (!S.loggedIn) screen = html`<${Login} key=${'login-' + S.role}/>`;
  else if (nav.screen === 'chart' && nav.aId) screen = html`<${Chart} key=${S.role + nav.aId} a=${byId(S.assignments, nav.aId)}/>`;
  else if (S.role === 'student') screen = html`<${StudentCases}/>`;
  else if (nav.screen === 'create') screen = html`<${CreateCase}/>`;
  else screen = html`<${InstructorDash}/>`;
  return html`<${Fragment}>
    <a className="skip" href="#main">Skip to main content</a>
    <${TopBar}/>
    <main id="main" tabIndex="-1" aria-hidden=${S.modal ? 'true' : undefined}>${screen}</main>
    <${ModalHost}/>
    <${Toasts}/>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
});
</script>
