server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always re-check index.html so a reload picks up a new build (the hashed
    # files under /assets/ change name every build, so they can stay cached).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
