# Render Blueprint: deploys the backend and frontend from this repo on every push
# to main. The database is Azure SQL (utepehrserver.database.windows.net, database
# UTEP-EHR-DB, Canada Central), not a container. Local development still uses
# docker-compose.yml and is unaffected.
#
# Values marked "sync: false" are secrets or depend on the deployed URLs. Render
# asks for them when the Blueprint is first created and never stores them in git.

services:
  # FastAPI backend, built from backend/Dockerfile.
  # Runs in Ohio, Render's closest region to the Azure SQL server (Canada Central),
  # because each request makes several database round trips one after another.
  # Render can't move a service between regions, so this is a new service
  # ("ehr-backend-ohio"); the old Oregon "ehr-backend" must be deleted by hand.
  - type: web
    name: ehr-backend-ohio
    region: ohio
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DB_SERVER
        value: utepehrserver.database.windows.net
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        value: UTEP-EHR-DB
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_TRUST_CERT
        value: "no"
      - key: DB_LOGIN_TIMEOUT
        value: "60"
      - key: COOKIE_SECURE
        value: "true"
      # The frontend's Render URL, e.g. https://ehr-frontend.onrender.com
      - key: CORS_ORIGINS
        sync: false

  # React frontend, built by Vite and served as a static site.
  - type: web
    name: ehr-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # API calls go to /api on the frontend's own domain, so the session cookie
      # stays same-origin. Render proxies them to the backend (first route below).
      - key: VITE_API_URL
        value: /api
    routes:
      # Must point at the Ohio backend's URL (Render dashboard -> ehr-backend-ohio).
      # Still the old Oregon backend until the Ohio service is created and set up;
      # then replace it with the new URL and delete the Oregon service.
      - type: rewrite
        source: /api/*
        destination: https://ehr-backend-k63q.onrender.com/*
      # Let React handle every other path.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Same as nginx.conf: always re-check index.html so a reload picks up a new build.
      - path: /index.html
        name: Cache-Control
        value: no-cache
