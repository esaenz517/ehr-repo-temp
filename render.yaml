# Render Blueprint: deploys the backend and frontend from this repo on every push
# to main. The database is Supabase Postgres (project in AWS us-east-2, Ohio, next to
# the backend), reached through Supabase's session pooler. Azure SQL
# (utepehrserver.database.windows.net / UTEP-EHR-DB) stays as a backup; see the
# backend envVars below to switch back. Local development still uses
# docker-compose.yml (SQL Server) and is unaffected.
#
# Values marked "sync: false" are secrets or depend on the deployed URLs. Render
# asks for them when the Blueprint is first created and never stores them in git.

services:
  # FastAPI backend, built from backend/Dockerfile.
  # Runs in Ohio, the same AWS region as the Supabase project (us-east-2), because
  # each request makes several database round trips one after another.
  - type: web
    name: ehr-backend-ohio
    region: ohio
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      # Supabase. To switch back to the Azure SQL backup, change these to
      # DB_DIALECT=mssql, DB_SERVER=utepehrserver.database.windows.net, DB_PORT=1433,
      # DB_NAME=UTEP-EHR-DB, DB_USER=<Azure SQL login>, set DB_PASSWORD in the
      # dashboard to the Azure password, and re-add Render's outbound IPs to the
      # Azure firewall if they were removed.
      - key: DB_DIALECT
        value: postgres
      - key: DB_SERVER
        value: aws-0-us-east-2.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.qrsszxfqhwgzdhciyyek
      # The Supabase database password (Project Settings -> Database). Never in git.
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      # Used only when DB_DIALECT=mssql (Azure SQL backup).
      - key: DB_TRUST_CERT
        value: "no"
      - key: DB_LOGIN_TIMEOUT
        value: "60"
      - key: COOKIE_SECURE
        value: "true"
      # The frontend's Render URL, e.g. https://ehr-frontend.onrender.com
      - key: CORS_ORIGINS
        sync: false

  # React frontend, built by Vite and served as a static site.
  - type: web
    name: ehr-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # API calls go to /api on the frontend's own domain, so the session cookie
      # stays same-origin. Render proxies them to the backend (first route below).
      - key: VITE_API_URL
        value: /api
    routes:
      # Points at the Ohio backend (ehr-backend-ohio). If Render gives the backend a
      # different URL, update this destination.
      - type: rewrite
        source: /api/*
        destination: https://ehr-backend-ohio.onrender.com/*
      # Let React handle every other path.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Same as nginx.conf: always re-check index.html so a reload picks up a new build.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Vite puts a content hash in every file name under /assets/, so a new build
      # always gets new names and the browser can keep these forever without asking.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
