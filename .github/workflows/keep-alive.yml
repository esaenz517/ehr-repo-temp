# Keeps the hosted app awake by calling it every 10 minutes:
# - Render's free plan shuts the backend down after 15 minutes without traffic, and
#   the next visitor then waits 30-60 seconds for it to start again.
# - Supabase's free plan pauses a project after a week without database activity.
# /api/health/db goes through the frontend's /api rewrite to the backend and runs a
# tiny query, so one request covers both.
#
# Run it by hand from GitHub: Actions -> Keep alive -> Run workflow.
# GitHub may start scheduled runs a few minutes late, and turns schedules off after
# 60 days without commits to the repo (re-enable it on the Actions tab).
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the backend and database
        # Retries cover a cold start (the first request can take up to a minute).
        run: |
          curl --fail --silent --show-error \
            --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors \
            https://ehr-frontend-dy43.onrender.com/api/health/db
